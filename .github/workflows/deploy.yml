      - name: Deploy Docker application
        run: |
          set -e

          echo "=== Syncing code to /opt/contoso-app ==="
          rsync -a --delete --no-owner --no-group \
            --exclude='.git' \
            --exclude='venv' \
            --exclude='.env' \
            ./ /opt/contoso-app/

          cd /opt/contoso-app

          echo "=== Running tests ==="
          source venv/bin/activate
          pytest

          echo "=== Building Docker image ==="
          IMAGE_TAG=${{ github.sha }}
          docker build -t contoso-app:$IMAGE_TAG .

          echo "=== Stopping old container ==="
          docker rm -f contoso-container || true

          echo "=== Starting new container ==="
          docker run -d \
            --name contoso-container \
            --restart unless-stopped \
            --env-file /opt/contoso-app/.env \
            -p 127.0.0.1:5000:5000 \
            contoso-app:$IMAGE_TAG

          echo "=== Waiting for application ==="
          sleep 5

          echo "=== Checking container ==="
          docker ps

          echo "=== Running health check ==="
          curl -f http://127.0.0.1:5000/health

          echo "=== Testing Nginx ==="
          curl -f http://127.0.0.1/health

          echo "=== Testing database ==="
          for i in 1 2 3; do
            if curl -fsS --max-time 20 http://127.0.0.1:5000/products; then
              echo "Database check passed"
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "Database check failed after 3 attempts"
              exit 1
            fi
            echo "Database check failed. Retrying in 5 seconds..."
            sleep 5
          done

          echo "=== Cleaning old Docker images ==="
          docker image prune -f

          echo "=== Deployment successful! ==="
